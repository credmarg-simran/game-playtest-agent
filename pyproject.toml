[project]
name = "game-playtest-agent"
version = "0.1.0"
description = "Plays browser games on its own and reports whether they work and whether they are fun"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "openai>=1.40", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
playtest = "playtest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["playtest*"]

[tool.setuptools.package-data]
playtest = ["browser/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
